version: skill-registry-v1
skills:
  - id: file-content-analysis
    name: 文件内容分析
    description: 从受控内容预览、结构摘要和关键字段中生成可核验的文档内容说明。
    path: file-content-analysis/SKILL.md
    task_types:
      - inventory
    roles:
      - content

  - id: version-relation
    name: 版本关系候选与解释
    description: 根据确定性差异、关系证据和硬约束提出版本关系候选并解释融合依据。
    path: version-relation/SKILL.md
    task_types:
      - version_analysis
    roles:
      - version

  - id: evidence-confidence
    name: 业务证据理解与置信度
    description: 结合确定性匹配和受控短摘录提出封闭业务证据候选，并说明证据限制。
    path: evidence-confidence/SKILL.md
    task_types:
      - evidence
    roles:
      - evidence

  - id: recommendation-second-opinion
    name: 受约束推荐第二意见
    description: 对压缩候选决策包提出可弃权的结构化意见，供固定规则融合。
    path: recommendation-second-opinion/SKILL.md
    task_types:
      - recommendation
    roles:
      - recommendation_judge

  - id: governance-report
    name: 治理报告编排
    description: 将版本事实、推荐、人工选择和错误整理为可审计的文件治理报告。
    path: governance-report/SKILL.md
    task_types:
      - human_review
      - report
    roles:
      - coordinator
