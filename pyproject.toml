[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-manage-agent"
version = "1.0.3"
description = "具备受约束双轨版本关系判定、语义变更分析与确定性人工审核规则的 LangGraph 只读文件版本治理 Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "pypdf>=5,<7",
    "PyYAML>=6,<7",
    "pydantic>=2.10,<3",
    "openai>=2.0,<3",
    "langchain>=1.1,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "APScheduler>=3.11,<4",
    "httpx>=0.27,<1",
    "mcp>=1.27,<2",
]

[project.scripts]
file-governance = "app.entrypoints.cli:main"
file-governance-api = "app.entrypoints.api:main"
file-governance-worker = "app.entrypoints.worker:main"
file-governance-scheduler = "app.entrypoints.scheduler:main"
file-governance-mock-email-mcp = "app.entrypoints.mock_email_mcp:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]
anthropic = [
    "langchain-anthropic>=1.0,<2",
]
gemini = [
    "langchain-google-genai>=4.0,<5",
]
deepseek = [
    "langchain-deepseek>=1.0,<2",
]
qwen = [
    "langchain-qwq>=0.3,<1",
]
openrouter = [
    "langchain-openrouter>=0.2,<1",
]
litellm = [
    "langchain-litellm>=0.7,<1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.data-files]
"examples" = ["examples/*.json"]
"resources/prompts" = ["resources/prompts/file_governance_system_v1.md"]
"resources/skills" = ["resources/skills/registry.yaml"]
"resources/skills/file-content-analysis" = ["resources/skills/file-content-analysis/SKILL.md"]
"resources/skills/version-relation" = ["resources/skills/version-relation/SKILL.md"]
"resources/skills/evidence-confidence" = ["resources/skills/evidence-confidence/SKILL.md"]
"resources/skills/governance-report" = ["resources/skills/governance-report/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
